<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Buku - Perpustakaan</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #f4f6f9; }
        .navbar {
            background-color: #1a73e8; color: white;
            padding: 15px 20px; display: flex;
            justify-content: space-between; align-items: center;
        }
        .navbar h1 { font-size: 18px; }
        .navbar a { color: white; text-decoration: none; font-size: 14px; }
        .container { padding: 20px; max-width: 900px; margin: auto; }
        .header-actions {
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 20px;
        }
        .header-actions h2 { color: #1a73e8; }
        .btn-tambah {
            background-color: #1a73e8; color: white;
            padding: 10px 18px; border: none;
            border-radius: 8px; cursor: pointer;
            font-weight: bold; font-size: 14px;
        }
        .btn-tambah:hover { background-color: #1557b0; }
        table {
            width: 100%; border-collapse: collapse;
            background: white; border-radius: 10px;
            overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        th, td {
            padding: 12px 15px; text-align: left;
            font-size: 13px; border-bottom: 1px solid #eee;
        }
        th { background-color: #1a73e8; color: white; font-size: 13px; }
        tr:hover { background-color: #f1f5ff; }
        .btn-aksi {
            padding: 5px 10px; border: none;
            border-radius: 5px; cursor: pointer;
            font-size: 12px; margin-right: 5px;
        }
        .btn-edit { background-color: #ffc107; color: #333; }
        .btn-hapus { background-color: #dc3545; color: white; }
    </style>
</head>
<body>

    <nav class="navbar">
        <h1>📖 Kelola Buku</h1>
        <a href="dashboard.html">← Kembali</a>
    </nav>

    <div class="container">
        <div class="header-actions">
            <h2>Daftar Buku</h2>
            <button class="btn-tambah" onclick="alert('Fitur tambah buku akan segera hadir!')">+ Tambah Buku</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>No</th>
                    <th>Judul</th>
                    <th>Penulis</th>
                    <th>Tahun</th>
                    <th>Stok</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>Belajar Pemrograman Web</td>
                    <td>Budi Raharjo</td>
                    <td>2023</td>
                    <td>5</td>
                    <td>
                        <button class="btn-aksi btn-edit" onclick="alert('Edit buku')">Edit</button>
                        <button class="btn-aksi btn-hapus" onclick="alert('Hapus buku')">Hapus</button>
                    </td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Rancangan Perangkat Lunak</td>
                    <td>Sri Mulyani</td>
                    <td>2022</td>
                    <td>3</td>
                    <td>
                        <button class="btn-aksi btn-edit" onclick="alert('Edit buku')">Edit</button>
                        <button class="btn-aksi btn-hapus" onclick="alert('Hapus buku')">Hapus</button>
                    </td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>Algoritma dan Struktur Data</td>
                    <td>Rinaldi Munir</td>
                    <td>2021</td>
                    <td>2</td>
                    <td>
                        <button class="btn-aksi btn-edit" onclick="alert('Edit buku')">Edit</button>
                        <button class="btn-aksi btn-hapus" onclick="alert('Hapus buku')">Hapus</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
