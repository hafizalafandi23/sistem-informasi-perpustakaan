<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem Informasi Perpustakaan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-container {
            background: white;
            padding: 30px 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }
        .login-container h1 {
            text-align: center;
            color: #1a73e8;
            font-size: 22px;
            margin-bottom: 5px;
        }
        .login-container p {
            text-align: center;
            color: #666;
            font-size: 13px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            color: #333;
            margin-bottom: 6px;
            font-weight: bold;
        }
        .form-group input, 
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
        }
        .form-group input:focus,
        .form-group select:focus {
            border-color: #1a73e8;
        }
        .btn-login {
            width: 100%;
            padding: 13px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn-login:hover {
            background-color: #1557b0;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
            color: #1a73e8;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h1>📚 Perpustakaan Digital</h1>
        <p>Silakan login untuk melanjutkan</p>

        <form onsubmit="return loginUser(event)">
            <div class="form-group">
                <label for="role">Login Sebagai</label>
                <select id="role" required>
                    <option value="">-- Pilih Role --</option>
                    <option value="admin">Admin (Petugas)</option>
                    <option value="anggota">Anggota (Siswa/Mahasiswa)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Masukkan username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Masukkan password" required>
            </div>

            <button type="submit" class="btn-login">Login</button>
        </form>

        <a href="index.html" class="back-link">← Kembali ke Halaman Utama</a>
    </div>

    <script>
        function loginUser(event) {
            event.preventDefault(); // Mencegah reload halaman

            const role = document.getElementById('role').value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // Simulasi login (username: admin / password: admin123)
            if (username === "admin" && password === "admin123" && role === "admin") {
                alert("Login berhasil sebagai Admin!");
                window.location.href = "dashboard.html";
            } 
            else if (username === "anggota" && password === "anggota123" && role === "anggota") {
                alert("Login berhasil sebagai Anggota!");
                window.location.href = "peminjaman.html";
            } 
            else {
                alert("Login gagal! Periksa username, password, dan role Anda.");
            }
        }
    </script>

</body>
</html>
