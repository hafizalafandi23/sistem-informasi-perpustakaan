<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Perpustakaan Digital</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body {
            /* Background gradasi modern */
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 20px;
        }

        .login-container {
            /* Efek kaca transparan (Glassmorphism) */
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            width: 100%; max-width: 400px;
            transition: transform 0.3s ease;
        }

        .login-container:hover { transform: translateY(-5px); }

        .login-container h1 {
            text-align: center; color: #333;
            font-size: 24px; margin-bottom: 5px;
        }

        .login-container p {
            text-align: center; color: #777;
            font-size: 14px; margin-bottom: 30px;
        }

        .form-group { margin-bottom: 20px; }

        .form-group label {
            display: block; font-size: 13px; color: #555;
            margin-bottom: 8px; font-weight: 600;
        }

        .form-group input, .form-group select {
            width: 100%; padding: 14px;
            border: 2px solid #e0e0e0; border-radius: 10px;
            font-size: 14px; outline: none;
            transition: all 0.3s ease;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: #667eea;
            box-shadow: 0 0 8px rgba(102, 126, 234, 0.3);
        }

        .btn-login {
            width: 100%; padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none; border-radius: 10px;
            font-size: 16px; font-weight: bold; cursor: pointer;
            margin-top: 10px; transition: all 0.3s ease;
        }

        .btn-login:hover {
            box-shadow: 0 5px 15px rgba(118, 75, 162, 0.4);
            transform: translateY(-2px);
        }

        .back-link {
            display: block; text-align: center;
            margin-top: 20px; font-size: 13px;
            color: #667eea; text-decoration: none; font-weight: 600;
        }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="login-container">
        <h1>📚 Perpustakaan Digital</h1>
        <p>Silakan login untuk melanjutkan</p>

        <form onsubmit="return loginUser(event)">
            <div class="form-group">
                <label for="role">Login Sebagai</label>
                <select id="role" required>
                    <option value="">-- Pilih Role --</option>
                    <option value="admin">Admin (Petugas)</option>
                    <option value="anggota">Anggota (Siswa/Mahasiswa)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Masukkan username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Masukkan password" required>
            </div>
            <button type="submit" class="btn-login">Login</button>
        </form>
        <a href="index.html" class="back-link">← Kembali ke Halaman Utama</a>
    </div>

    <script>
        function loginUser(event) {
            event.preventDefault();
            const role = document.getElementById('role').value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (username === "admin" && password === "admin123" && role === "admin") {
                alert("Login berhasil sebagai Admin!");
                window.location.href = "dashboard.html";
            } else if (username === "anggota" && password === "anggota123" && role === "anggota") {
                alert("Login berhasil sebagai Anggota!");
                window.location.href = "peminjaman.html";
            } else {
                alert("Login gagal! Periksa username, password, dan role Anda.");
            }
        }
    </script>
</body>
</html>
