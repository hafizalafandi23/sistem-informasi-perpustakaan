<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruang Anggota</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f2f5; }
        .navbar { background: #1a73e8; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .navbar h1 { font-size: 18px; }
        .nav-links a { color: white; text-decoration: none; font-size: 14px; font-weight: bold; padding: 8px 15px; border-radius: 8px; cursor: pointer; margin-left: 5px; }
        .nav-links a.active { background: rgba(255,255,255,0.3); }
        .container { padding: 25px 20px; max-width: 1000px; margin: auto; }
        .search-box { background: white; padding: 15px 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 30px; display: flex; }
        .search-box input { flex: 1; padding: 12px 15px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 15px; outline: none; }
        .buku-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .buku-card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; flex-direction: column; justify-content: space-between; }
        .buku-card h4 { color: #1a73e8; margin-bottom: 10px; }
        .btn-pinjam { width: 100%; padding: 12px; margin-top: 15px; background: #1a73e8; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .riwayat-card { background: white; padding: 20px; border-radius: 15px; margin-bottom: 15px; border-left: 5px solid #1a73e8; }
        .status-badge { display: inline-block; padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; margin-top: 10px; }
        .bg-dipinjam { background: #fff3cd; color: #856404; }
        .bg-kembali { background: #d4edda; color: #155724; }
        .text-telat { color: #dc3545; font-weight: bold; }
        .profil-card { background: white; padding: 30px; border-radius: 15px; text-align: center; max-width: 500px; margin: auto; }
        .profil-icon { font-size: 60px; margin-bottom: 15px; }
        .profil-data { background: #f8f9fa; padding: 15px; border-radius: 10px; text-align: left; margin-top: 20px; }
        .profil-data div { display: flex; justify-content: space-between; border-bottom: 1px solid #ddd; padding: 10px 0; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <nav class="navbar">
        <h1>📚 Ruang Anggota</h1>
        <div class="nav-links">
            <a id="menu-katalog" class="active" onclick="bukaMenu('katalog')">Katalog</a>
            <a id="menu-riwayat" onclick="bukaMenu('riwayat')">Riwayat Pinjam</a>
            <a id="menu-profil" onclick="bukaMenu('profil')">Profil</a>
            <a href="login.html" onclick="return confirm('Yakin ingin keluar?')" style="background: rgba(220, 53, 69, 0.8);">Logout</a>
        </div>
    </nav>
    <div class="container">
        <div id="section-katalog">
            <div class="search-box"><input type="text" id="input-cari" placeholder="🔍 Cari judul atau penulis..." onkeyup="cariBuku()"></div>
            <div class="buku-grid" id="katalog-buku"></div>
        </div>
        <div id="section-riwayat" class="hidden">
            <h2>Riwayat Peminjaman</h2>
            <div id="list-riwayat"></div>
        </div>
        <div id="section-profil" class="hidden">
            <div class="profil-card">
                <div class="profil-icon">👤</div>
                <h3 id="profil-nama">Nama</h3>
                <p id="profil-role">Role</p>
                <div class="profil-data">
                    <div><span>Username</span><span id="profil-username">-</span></div>
                    <div><span>Status Akun</span><span style="color: green; font-weight: bold;">Aktif</span></div>
                </div>
            </div>
        </div>
    </div>
    <script>
        const userLogin = JSON.parse(localStorage.getItem('userLogin'));
        if (!userLogin) window.location.href = "login.html";
        document.getElementById('profil-nama').innerText = userLogin.nama;
        document.getElementById('profil-role').innerText = userLogin.role === 'anggota' ? 'Anggota Perpustakaan' : 'Administrator';
        document.getElementById('profil-username').innerText = userLogin.username;
        
        const formatTanggal = (date) => { let d = new Date(date), m = '' + (d.getMonth() + 1), day = '' + d.getDate(), y = d.getFullYear(); if (m.length < 2) m = '0' + m; if (day.length < 2) day = '0' + day; return [y, m, day].join('-'); };
        
        function bukaMenu(menu) {
            document.getElementById('section-katalog').classList.add('hidden');
            document.getElementById('section-riwayat').classList.add('hidden');
            document.getElementById('section-profil').classList.add('hidden');
            document.getElementById('menu-katalog').classList.remove('active');
            document.getElementById('menu-riwayat').classList.remove('active');
            document.getElementById('menu-profil').classList.remove('active');
            
            document.getElementById('section-' + menu).classList.remove('hidden');
            document.getElementById('menu-' + menu).classList.add('active');
            if (menu === 'riwayat') renderRiwayat();
        }

        let daftarBuku = JSON.parse(localStorage.getItem('dataBuku')) || [];
        const container = document.getElementById('katalog-buku');
        function renderKatalog(data = daftarBuku) {
            container.innerHTML = '';
            if (data.length === 0) { container.innerHTML = `<p style="grid-column: 1/-1; text-align:center;">Buku tidak ditemukan.</p>`; return; }
            data.forEach(buku => {
                const indexAsli = daftarBuku.findIndex(b => b.judul === buku.judul);
                container.innerHTML += `<div class="buku-card"><div><h4>${buku.judul}</h4><p>Penulis: ${buku.penulis}</p><p>Tahun: ${buku.tahun}</p><p>Stok: <b>${buku.stok}</b></p></div>
                <button class="btn-pinjam" onclick="pinjamBuku('${buku.judul}', ${indexAsli})">Pinjam Buku</button></div>`;
            });
        }
        function cariBuku() {
            const keyword = document.getElementById('input-cari').value.toLowerCase();
            renderKatalog(daftarBuku.filter(b => b.judul.toLowerCase().includes(keyword) || b.penulis.toLowerCase().includes(keyword)));
        }
        function pinjamBuku(judul, i) {
            if (daftarBuku[i].stok <= 0) { alert("Stok habis!"); return; }
            let hariIni = new Date(); let jatuhTempo = new Date(); jatuhTempo.setDate(hariIni.getDate() + 7);
            let dataPinjaman = JSON.parse(localStorage.getItem('dataPinjaman')) || [];
            dataPinjaman.push({ nama: userLogin.nama, judul, tglPinjam: formatTanggal(hariIni), tglJatuhTempo: formatTanggal(jatuhTempo), status: "Dipinjam" });
            localStorage.setItem('dataPinjaman', JSON.stringify(dataPinjaman));
            daftarBuku[i].stok--; localStorage.setItem('dataBuku', JSON.stringify(daftarBuku));
            alert(`Berhasil meminjam ${judul}. Kembalikan sebelum ${formatTanggal(jatuhTempo)}`);
            document.getElementById('input-cari').value = ''; renderKatalog();
        }
        function renderRiwayat() {
            const list = document.getElementById('list-riwayat');
            let semua = JSON.parse(localStorage.getItem('dataPinjaman')) || [];
            let saya = semua.filter(p => p.nama === userLogin.nama);
            if (saya.length === 0) { list.innerHTML = `<div class="riwayat-card">Belum ada riwayat.</div>`; return; }
            list.innerHTML = '';
            saya.reverse().forEach(item => {
                let badge = item.status === 'Dipinjam' ? 'bg-dipinjam' : 'bg-kembali';
                let info = '';
                if (item.status === 'Dipinjam' && item.tglJatuhTempo) {
                    let hariIni = new Date(); hariIni.setHours(0,0,0,0);
                    let selisih = Math.ceil((new Date(item.tglJatuhTempo).getTime() - hariIni.getTime()) / (1000 * 3600 * 24));
                    info = selisih < 0 ? `<p class="text-telat">⚠️ Terlambat ${Math.abs(selisih)} hari!</p>` : `<p style="color: #28a745;">Sisa waktu: ${selisih} hari lagi.</p>`;
                }
                list.innerHTML += `<div class="riwayat-card"><h4>📖 ${item.judul}</h4><p>Tgl Pinjam: ${item.tglPinjam}</p><p>Jatuh Tempo: ${item.tglJatuhTempo || '-'}</p>${info}<div class="status-badge ${badge}">${item.status}</div></div>`;
            });
        }
        renderKatalog();
    </script>
</body>
</html>
